## Происхождение

Эдуард Борисович Жопов родился 3 марта 1901 года в Пятигорске, в доме призреваемых [№ 32](#32). Метрическую запись видел белоэмигрант граф Габарджобов-Ус; по его же сведениям, это мог быть январь 1901-го или февраль 1904-го [№ 4](#4). Сам Мэтр рассказывал третью версию: младенцем его подбросили под паровоз «Тверь — Мармыжи», а спасла его тётка Прасковья Кроликова, машинист [№ 253](#253).

Отцом был Борис Викторович Савинков, руководитель боевого крыла эсеров. Мать — Матрёна Васильевна Жопова, ивановская ткачиха и таролог. Савинков вспоминал, что в день рождения сына принёс Матрёне ромашки, а она хотела роз. Тут из кроватки донеслось: «Миллион, миллион алых роз». Отец решил, что младенец — предвестник большевизма, и сдал его в дом призреваемых [№ 4](#4). По материнской линии Жопов, как выяснилось позже, в родстве с бароном Мюнхгаузеном [№ 96](#96).

## Юность

В декабре 1916 года пятнадцатилетний Жопов лечился у земского врача Михаила Булгакова в селе Никольское. В графе «род занятий» Булгаков записал: «Писатель». Позже он отозвался о пациенте так: «Не по годам развитый, с маршаковским чувством юмора и цинизмом Агнии Барто» [№ 3](#3).

В ноябре 1918-го о юноше написал Лев Троцкий, в передовице газеты «Красный будуар». Ленин тогда смеялся над его «Дамой с собачкой», а Крупская плакала [№ 3](#3). Через год Жопов изобрёл станок, который сужал слишком широкие души и расширял слишком узкие, и получил за изобретение десять лет пионерских лагерей [№ 6](#6). Этот срок ему потом дадут ещё не раз.

Первую женскую ласку он узнал в семнадцать лет от кабаре-певицы Валентины Тошницкой. Она сравнила его с Фицджеральдом и ушла [№ 201](#201). В 1923 году Жопов закончил первый роман, показал его в райкоме и был арестован прямо там. Из комсомола его исключили. «Я загрустил», — вспоминал Мэтр [№ 123](#123). В Институте красной профессуры стипендия уходила на книги, зубровку и кукольниц из театра Советской драмы [№ 226](#226).

## Тридцатые

В 1933 году по доносу Агнии Барто Жопова расстреляли в подвале Лубянки. «Но это же Жопов. Пуля мэтра не берёт», — свидетельствует ветеран медицины Н. Н. Безногим. Шрам на груди позже принимали за масонское «око», потом его забили профилями Маркса, Энгельса, Ленина и Сталина [№ 43](#43). В 1936-м Мэтр съездил в командировку в Курск и написал для «Правды» заметку о сосисочном сервисе. Подписал псевдонимом, чтобы не беспокоили поклонницы [№ 51](#51).

## Хабаровск

1939 год прошёл в Хабаровске. Жопов работал в кочегарке, потом в отделе пропаганды и агитации мореплавильного комбината, где одним из первых в мире освоил чёрный пиар [№ 418](#418). Ночевал на вокзале среди бомжей, зэков и диссидентов. Из этого вырос главный роман, «Судьба моя – бомжарить» [№ 44](#44), [№ 47](#47). Тогда же секретарь горисполкома товарищ Маузер посоветовал ему завести сберкнижку для «доната» и бросить стихи. Со стихами Жопов послушался не до конца.

В Хабаровск он возвращался всю жизнь, своей волей и по приговору. Последнее из его правил жизни звучит так: «В любой непонятной ситуации – уезжай в Хабаровск» [№ 1237](#1237).

## Женщины

Жён исследователи насчитывают от трёх до восьми. По документам известны Полина Виардо, вторая жена, — по рисунку Пикассо 1937 года [№ 102](#102); Аполлинария Суслова — по дневнику 1949 года [№ 45](#45); Айседора Дункан [№ 17](#17) и Женсонесса Рысь, царинесса советского сентиментального романа и автор «Ног отчима» [№ 177](#177), [№ 288](#288). Детей, по подсчётам жоповедов, было шестьсот. Алименты Мэтр платил на всех [№ 205](#205).

Любил он, по свидетельству Франца Кафки, одну женщину: иллюстратора московского Дома кино Сару Изольдовну Кусь. Ей посвящены девятьсот романов. Мэтр купил ей город Диксон и «кадиллак», стрелялся из-за неё и промахнулся. Сара уехала в Швейцарию. Тогда он купил ей Альпы [№ 94](#94).

## Председатель

В 1957 году на Всемирном фестивале молодёжи Маркес обвинил Жопова в краже сюжета «Тихого Дона». Жопов ответил: «Я и есть сюжет „Тихого Дона“» — и ударил Маркеса. Вину в милиции взял на себя Чарльз Буковски [№ 20](#20). В том же году особая «четвёрка» арестовала Мэтра за новояз в тексте «Паскуды». Снова десять лет пионерских лагерей [№ 33](#33).

В 1963-м Эдуард Борисович возглавил Союз писателей СССР. Водка в буфете правления стоила дешевле воды, новичку отдавали 64 тысячи авторских листов в «Роман-газете», смертность писателей снизилась втрое. Реформатора вскоре сместили [№ 50](#50). Распорядок дня 1967 года сохранился целиком: подъём в пять утра, четыре бутылки «Жигулей» до девяти, вечером драка с молодым Лимоновым [№ 38](#38).

## Мировая слава

Хемингуэй писал о нём Пастернаку [№ 88](#88). Камю встретил его в парижском кафе «Les Deux Magots» и очнулся внутри «Чумы» [№ 12](#12). Бродский пытался вывезти его из СССР в чемодане, но в Пулкове Мэтра изъяли [№ 7](#7). На Нобелевскую премию его выдвигали от двадцати до тридцати раз. Не дали, по словам самого Жопова, потому что он танцевал «Яблочко» в партийных кулуарах. Есть и другая версия: его ни разу не номинировали [№ 218](#218).

В 1978 году он ездил в Мексику к Октавио Пасу и отбил у бандитов свой ковёр с оленями, украденный из коммуналки в 1957-м [№ 219](#219). В 1992-м дал большое интервью колумбийскому журналисту Хосе Аркадио Буэндиа [№ 158](#158).

## Вечность

Последний датированный текст Мэтра — рождественский рассказ «Мечта», 2000 год [№ 1072](#1072). Даты смерти в документах нет. В декабре 2024 года сообщалось, что «последние 20 лет Мэтр обеспечивает безопасность из Вечности» [№ 1357](#1357); выходит, ушёл он в начале 2000-х. На смертном одре успел подсыпать соль в чай критику Константину Комарову [№ 174](#174). Часть жоповедов смерть отрицает: «Жопов вне смерти. Жопов жив» [№ 189](#189).

Похоронен на Ваганьковском кладбище, 17-й участок, недалеко от Есенина. Над могилой стоит фонарный столб [№ 1270](#1270).

