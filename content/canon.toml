photo = "233:1"
text = "Настоящее имя — Тамара Дионисовна Воронцова, родилась в 1952 году в Москве, на улице Горького. Псевдоним взяла по отцу, инженеру Василису Александровичу Рыси. Автор бестселлера «Ноги отчима» и ещё шестидесяти трёх романов, основоположница отечественной «литературы травмы». В 1972 году Жопов прилетел к ней на 64 голубях. Мэтр говорил ей: «Ночью жопа – барыня». С 19 января 2024 года её имя под запретом, теперь она просто Рысь. Ведёт собственный канал, записи из него собраны отдельно."
