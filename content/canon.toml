photo = "233:2"
text = "Единственная женщина, которую Мэтр, по свидетельству Франца Кафки, любил. Ей посвящены девятьсот романов. Жопов купил ей город Диксон, «кадиллак» и Альпы; она уехала в Швейцарию и участвовала в изобретении «Фотошопа». В 1955 году забрала Мэтра из пионерского лагеря и увезла в США. Гордилась усиками. День рождения — 4 января."
