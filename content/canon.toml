# Кураторская разметка архива.
# Числа — номера записей канала «Писатель Эдуард Жопов» (t.me/e_jopov/<номер>).
# Тексты самих записей берутся из data/posts.json без правки.

[site]
title = "Архив Эдуарда Жопова"
subtitle = "Собрание документов о жизни и наследии мэтра русской словесности"
channel = "e_jopov"
channel_title = "Писатель Эдуард Жопов"
# адрес сайта на GitHub Pages; нужен странице 404, которая открывается по любому пути
base_path = "/EdwardAssman-Eduard-Zhopov/"
site_url = "https://ivankritskiy.github.io/EdwardAssman-Eduard-Zhopov/"
# портрет Мэтра, путь внутри папки экспорта
portrait = "photos/Zhopov_portrait.jpg"
epigraph = "Жопов – юноша с горящим сердцем, крепким умом и важным местом, имеет революционную выдержку и отменный слог."
epigraph_by = "Л. Д. Троцкий, газета «Красный будуар», ноябрь 1918"
epigraph_post = 3

# ---------------------------------------------------------------- Собрание сочинений
# Тома выстроены по датировке, которую дают публикаторы. Год можно не указывать:
# сборщик достанет его из примечания («Датирован 1992 годом», «Написан в 1956 году»).

[[volumes]]
title = "Том первый. Ранняя проза"
years = "1928–1939"
note = "Три текста довоенной поры. «Борьба» опубликована в 1928 году на камне, «Древо жизни» запрещено в 1939-м и пролежало в архиве восемьдесят пять лет."
works = [1460, 211, 1386]

[[volumes]]
title = "Том второй. Оттепель"
years = "1954–1963"
note = "Рассказы, написанные между пионерскими лагерями и председательством в Союзе писателей. Три из четырёх были запрещены."
works = [572, 1428, 552, 186]

[[volumes]]
title = "Том третий. Зрелость"
years = "1972–1986"
note = "Семидесятые и восьмидесятые. «Капибара» — единственная известная попытка Мэтра писать для детей: он хотел затмить Ягодичкина и проиграл, рассказ запретили."
works = [1344, 1382, 245, 155]

[[volumes]]
title = "Том четвёртый. Перестройка и девяностые"
years = "1989–1994"
note = "Самый плодовитый период из сохранившихся: девять рассказов за шесть лет. «Хахасмехов» найден в библиотеке Конгресса, рукопись подписана: «Токио, 1990 г.»."
works = [1103, 275, 1335, 1378, 48, 176, 527, 323, 1351]

[[volumes]]
title = "Том пятый. Поздние тексты"
years = "2000"
note = "Последний датированный рассказ Мэтра. Рождественский."
works = [1072]

[[volumes]]
title = "Том шестой. Без даты"
years = "—"
note = "Датировка не установлена."
works = [162]

[[volumes]]
title = "Публицистика"
years = "1992"
note = "Эссе о прошлом, которое пишут по газетам."
works = [737]

[[volumes]]
title = "Приложение. Э. А. Ягодичкин"
years = "—"
note = "Рассказы детского писателя Эдуарда Адольфовича Ягодичкина, многолетнего оппонента Мэтра. Печатаются, чтобы читатель мог сравнить сам."
works = [180, 165, 164, 335, 195]
appendix = true

